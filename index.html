<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كشري الصفوة - El-Safwa Koshary | Aswan</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   CSS CUSTOM PROPERTIES & THEMING
   ══════════════════════════════════════════ */
:root {
  --gold: #FFBE1A;
  --gold-deep: #D49B00;
  --red: #E62222;
  --red-deep: #B51515;
  --black: #0D0D11;
  --slate: #1A1A24;
  --white: #FAFAFA;

  /* Dark theme (default) */
  --bg: #0D0D11;
  --bg2: #1A1A24;
  --surface: #22222E;
  --surface2: #2A2A38;
  --text: #F1F1F1;
  --text2: #A0A0B0;
  --border: rgba(255,255,255,0.06);
  --glass-bg: rgba(26,26,36,0.7);
  --glass-border: rgba(255,190,26,0.12);
  --shadow: rgba(0,0,0,0.5);
  --card-glow: rgba(255,190,26,0.05);
  --overlay: rgba(0,0,0,0.7);
}

[data-theme="light"] {
  --bg: #F5F3EF;
  --bg2: #FFFFFF;
  --surface: #FFFFFF;
  --surface2: #F0ECE5;
  --text: #1A1A24;
  --text2: #6B6B7B;
  --border: rgba(0,0,0,0.08);
  --glass-bg: rgba(255,255,255,0.75);
  --glass-border: rgba(212,155,0,0.2);
  --shadow: rgba(0,0,0,0.1);
  --card-glow: rgba(255,190,26,0.08);
  --overlay: rgba(0,0,0,0.45);
}

/* ══════════════════════════════════════════
   RESET & BASE
   ══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 100px;
  transition: background 0.5s ease, color 0.4s ease;
}

/* ══════════════════════════════════════════
   ANIMATIONS & KEYFRAMES
   ══════════════════════════════════════════ */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.5); opacity: 0.4; }
}
@keyframes radarPulse {
  0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
  70%  { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
}
@keyframes shimmer {
  0%   { background-position: -200% center; }
  100% { background-position: 200% center; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
@keyframes glowPulse {
  0%, 100% { text-shadow: 0 0 10px rgba(255,190,26,0.3); }
  50%      { text-shadow: 0 0 25px rgba(255,190,26,0.6), 0 0 50px rgba(255,190,26,0.2); }
}
@keyframes gradientMesh {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.88) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes badgePop {
  0%   { transform: scale(0.5); }
  60%  { transform: scale(1.3); }
  100% { transform: scale(1); }
}
@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
  50%      { opacity: 1; transform: scale(1) rotate(180deg); }
}
@keyframes rotateTheme {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes slideInCart {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}

.stagger-1 { animation-delay: 0.05s; }
.stagger-2 { animation-delay: 0.1s; }
.stagger-3 { animation-delay: 0.15s; }
.stagger-4 { animation-delay: 0.2s; }
.stagger-5 { animation-delay: 0.25s; }
.stagger-6 { animation-delay: 0.3s; }

/* ══════════════════════════════════════════
   HEADER
   ══════════════════════════════════════════ */
.header {
  position: sticky; top: 0; z-index: 500;
  background: var(--glass-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  padding: 12px 24px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px;
  transition: background 0.4s;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 1.6rem; font-weight: 900;
  color: var(--gold);
  animation: glowPulse 3s ease-in-out infinite;
  cursor: default; position: relative;
}
.logo .icon { font-size: 1.8rem; animation: float 3s ease-in-out infinite; }
.logo .sub { color: var(--red); font-weight: 800; }

/* Sparkle particles near logo */
.logo::after {
  content: '✦';
  position: absolute;
  top: -4px; right: -14px;
  font-size: 0.6rem;
  color: var(--gold);
  animation: sparkle 2.5s ease-in-out infinite;
}

.header-controls {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}

.ctrl-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 14px;
  border-radius: 10px;
  font-family: 'Cairo', sans-serif;
  font-weight: 600; font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative; overflow: hidden;
}
.ctrl-btn:hover {
  border-color: var(--gold);
  box-shadow: 0 0 15px rgba(255,190,26,0.15);
  transform: translateY(-1px);
}
.ctrl-btn .rotating { display: inline-block; transition: transform 0.6s ease; }
.ctrl-btn:active .rotating { transform: rotate(360deg); }

/* Kitchen indicator */
.kitchen-dot {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.78rem; font-weight: 600; color: #22c55e;
}
.kitchen-dot .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #22c55e;
  animation: radarPulse 1.8s ease-out infinite;
}

/* ══════════════════════════════════════════
   HERO SECTION
   ══════════════════════════════════════════ */
.hero {
  position: relative;
  text-align: center;
  padding: 60px 20px 50px;
  margin: 20px 16px;
  border-radius: 24px;
  overflow: hidden;
  background: linear-gradient(-45deg, #0D0D11, #1a0a0a, #1a1400, #0D0D11, #0a0a1a);
  background-size: 400% 400%;
  animation: gradientMesh 12s ease infinite;
}
[data-theme="light"] .hero {
  background: linear-gradient(-45deg, #fff8e8, #ffe8e8, #fff3d4, #f0e8ff, #e8f5ff);
  background-size: 400% 400%;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 40%, rgba(255,190,26,0.1) 0%, transparent 60%),
              radial-gradient(circle at 70% 60%, rgba(230,34,34,0.08) 0%, transparent 60%);
  pointer-events: none;
}
.hero h1 {
  font-size: clamp(1.6rem, 5vw, 2.6rem);
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 10px;
  animation: fadeInUp 0.8s ease both;
  position: relative;
}
.hero p {
  font-size: clamp(0.9rem, 2.5vw, 1.15rem);
  color: var(--text2);
  font-weight: 400;
  animation: fadeInUp 0.8s ease 0.15s both;
  position: relative;
}

/* ══════════════════════════════════════════
   CATEGORY FILTER TABS
   ══════════════════════════════════════════ */
.container { max-width: 1140px; margin: 0 auto; padding: 0 16px; }

.filter-bar {
  display: flex; gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 28px 0 24px;
  animation: fadeIn 0.6s ease both;
}
.filter-btn {
  padding: 9px 22px;
  border-radius: 50px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  font-family: 'Cairo', sans-serif;
  font-weight: 700; font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.filter-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
}
.filter-btn.active {
  background: linear-gradient(135deg, var(--gold), var(--gold-deep));
  color: #000;
  border-color: transparent;
  box-shadow: 0 4px 20px rgba(255,190,26,0.3);
}

/* ══════════════════════════════════════════
   MENU GRID & CARDS
   ══════════════════════════════════════════ */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 22px;
  padding-bottom: 30px;
}

.dish-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  animation: fadeInUp 0.6s ease both;
  position: relative;
  display: flex; flex-direction: column;
}
.dish-card::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--card-glow), transparent);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}
.dish-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 40px var(--shadow), 0 0 25px rgba(255,190,26,0.08);
  border-color: var(--glass-border);
}
.dish-card:hover::before { opacity: 1; }

.card-img-area {
  height: 160px;
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  display: flex; align-items: center; justify-content: center;
  font-size: 3.5rem;
  position: relative; overflow: hidden;
}
.card-img-area::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(to top, var(--surface), transparent);
}

.card-body {
  padding: 18px;
  flex: 1;
  display: flex; flex-direction: column;
}
.card-category {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.card-title {
  font-size: 1.15rem;
  font-weight: 800;
  margin-bottom: 6px;
  line-height: 1.4;
}
.card-desc {
  font-size: 0.82rem;
  color: var(--text2);
  margin-bottom: 14px;
  flex: 1;
  line-height: 1.6;
}

.card-footer {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.card-price {
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--gold);
  display: flex; align-items: baseline; gap: 4px;
}
.card-price .curr {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text2);
}

.btn-order {
  padding: 9px 20px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--red), var(--red-deep));
  color: #fff;
  font-family: 'Cairo', sans-serif;
  font-weight: 800;
  font-size: 0.85rem;
  cursor: pointer;
  position: relative; overflow: hidden;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}
.btn-order::before {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  animation: shimmer 3s ease infinite;
}
.btn-order:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 20px rgba(230,34,34,0.4);
}
.btn-order:active { transform: scale(0.97); }

/* ══════════════════════════════════════════
   ORDER MODAL
   ══════════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 900;
  background: var(--overlay);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; visibility: hidden;
  transition: all 0.35s;
}
.modal-overlay.open { opacity: 1; visibility: visible; }

.modal-box {
  background: var(--glass-bg);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 30px;
  max-width: 440px; width: 100%;
  transform: scale(0.88) translateY(20px);
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 25px 80px rgba(0,0,0,0.5);
}
.modal-overlay.open .modal-box {
  transform: scale(1) translateY(0);
}

.modal-close {
  position: absolute; top: 16px; left: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text2);
  width: 36px; height: 36px;
  border-radius: 50%;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
}
[dir="ltr"] .modal-close { left: auto; right: 16px; }
.modal-close:hover {
  background: var(--red);
  color: #fff;
  border-color: transparent;
}

.modal-box { position: relative; }
.modal-dish-name {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 4px;
}
.modal-dish-desc {
  font-size: 0.85rem;
  color: var(--text2);
  margin-bottom: 20px;
}

.qty-row {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; margin-bottom: 20px;
}
.qty-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  background: transparent;
  color: var(--gold);
  font-size: 1.4rem; font-weight: 900;
  cursor: pointer;
  transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cairo', sans-serif;
}
.qty-btn:hover {
  background: var(--gold);
  color: #000;
  box-shadow: 0 0 20px rgba(255,190,26,0.3);
}
.qty-display {
  font-size: 2rem; font-weight: 900;
  color: var(--text);
  min-width: 50px; text-align: center;
}
.modal-total {
  text-align: center;
  font-size: 1.1rem; font-weight: 700;
  color: var(--text2);
  margin-bottom: 24px;
}
.modal-total span {
  color: var(--gold);
  font-size: 1.5rem; font-weight: 900;
}

.modal-actions {
  display: flex; flex-direction: column; gap: 12px;
}

.btn-action {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  font-family: 'Cairo', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  position: relative; overflow: hidden;
}
.btn-action::before {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  animation: shimmer 2.5s ease infinite;
}

.btn-phone {
  background: linear-gradient(135deg, var(--red), var(--red-deep));
  color: #fff;
}
.btn-phone:hover {
  box-shadow: 0 6px 30px rgba(230,34,34,0.45);
  transform: translateY(-2px);
}

.btn-whatsapp {
  background: linear-gradient(135deg, #25D366, #128C7E);
  color: #fff;
}
.btn-whatsapp:hover {
  box-shadow: 0 6px 30px rgba(37,211,102,0.4);
  transform: translateY(-2px);
}

/* ══════════════════════════════════════════
   FLOATING CART BAR
   ══════════════════════════════════════════ */
.cart-float {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 600;
  background: var(--glass-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--glass-border);
  padding: 14px 24px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 -4px 30px var(--shadow);
  transform: translateY(100%);
  transition: transform 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
}
.cart-float.visible {
  transform: translateY(0);
  animation: slideInCart 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
}

.cart-info-area {
  display: flex; align-items: center; gap: 12px;
}
.cart-badge {
  background: var(--red);
  color: #fff;
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 0.9rem;
  animation: badgePop 0.4s ease;
}
.cart-total-text {
  font-weight: 800; font-size: 1.05rem;
}
.cart-total-text span { color: var(--gold); }

.btn-view-cart {
  padding: 10px 22px;
  border: 2px solid var(--gold);
  border-radius: 12px;
  background: transparent;
  color: var(--gold);
  font-family: 'Cairo', sans-serif;
  font-weight: 800; font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-view-cart:hover {
  background: var(--gold);
  color: #000;
  box-shadow: 0 0 20px rgba(255,190,26,0.25);
}

/* ══════════════════════════════════════════
   CART DRAWER MODAL
   ══════════════════════════════════════════ */
.cart-drawer-overlay {
  position: fixed; inset: 0; z-index: 800;
  background: var(--overlay);
  backdrop-filter: blur(6px);
  opacity: 0; visibility: hidden;
  transition: all 0.35s;
}
.cart-drawer-overlay.open { opacity: 1; visibility: visible; }

.cart-drawer {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 850;
  background: var(--surface);
  border-top-left-radius: 24px; border-top-right-radius: 24px;
  border: 1px solid var(--glass-border);
  border-bottom: none;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px;
  transform: translateY(100%);
  transition: transform 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
}
.cart-drawer-overlay.open + .cart-drawer,
.cart-drawer.open { transform: translateY(0); }

.cart-drawer-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 4px;
  margin: 0 auto 20px;
}
.cart-drawer h3 {
  font-size: 1.2rem; font-weight: 900; margin-bottom: 16px; color: var(--gold);
}

.cart-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  gap: 10px;
}
.cart-row-name { flex: 1; font-weight: 700; font-size: 0.95rem; }
.cart-row-qty {
  display: flex; align-items: center; gap: 8px;
}
.cart-row-qty button {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-weight: 700; cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.cart-row-qty button:hover { border-color: var(--gold); color: var(--gold); }
.cart-row-qty span { font-weight: 800; min-width: 20px; text-align: center; }
.cart-row-price { font-weight: 800; color: var(--gold); min-width: 60px; text-align: left; }
.cart-row-remove {
  background: none; border: none;
  color: var(--red); cursor: pointer;
  font-size: 1.1rem; padding: 4px;
  transition: transform 0.2s;
}
.cart-row-remove:hover { transform: scale(1.2); }

.cart-summary {
  margin-top: 20px; text-align: center;
}
.cart-grand-total {
  font-size: 1.5rem; font-weight: 900; color: var(--gold); margin-bottom: 16px;
}
.cart-send-actions {
  display: flex; gap: 10px; flex-wrap: wrap;
}
.cart-send-actions .btn-action { flex: 1; min-width: 180px; }

.cart-empty-msg {
  text-align: center; padding: 40px;
  color: var(--text2); font-size: 1.1rem;
}

/* ══════════════════════════════════════════
   TOAST
   ══════════════════════════════════════════ */
.toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px);
  color: var(--text);
  padding: 12px 28px;
  border-radius: 50px;
  font-weight: 700; font-size: 0.88rem;
  box-shadow: 0 8px 30px var(--shadow);
  opacity: 0; visibility: hidden;
  transition: all 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  z-index: 1000;
  white-space: nowrap;
}
.toast.show {
  opacity: 1; visibility: visible;
  transform: translateX(-50%) translateY(0);
}

/* ══════════════════════════════════════════
   UTILITIES & RESPONSIVE
   ══════════════════════════════════════════ */
.hidden { display: none !important; }

@media (max-width: 640px) {
  .header { padding: 10px 14px; }
  .logo { font-size: 1.2rem; }
  .hero { padding: 40px 16px 35px; margin: 14px 10px; }
  .menu-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .card-img-area { height: 110px; font-size: 2.5rem; }
  .card-body { padding: 12px; }
  .card-title { font-size: 0.95rem; }
  .card-desc { font-size: 0.75rem; margin-bottom: 10px; }
  .card-price { font-size: 1.05rem; }
  .btn-order { padding: 7px 12px; font-size: 0.75rem; }
  .modal-box { padding: 22px; }
  .cart-float { padding: 10px 14px; }
}
@media (max-width: 380px) {
  .menu-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<header class="header">
  <div class="logo">
    <span class="icon">🍛</span>
    كشري <span class="sub">الصفوة</span>
  </div>
  <div class="header-controls">
    <div class="kitchen-dot">
      <span class="dot"></span>
      <span id="kitchenLabel">المطبخ مفتوح</span>
    </div>
    <button class="ctrl-btn" onclick="toggleLang()" id="langBtn">English</button>
    <button class="ctrl-btn" onclick="toggleTheme()" id="themeBtn">
      <span class="rotating" id="themeIcon">🌙</span>
    </button>
  </div>
</header>

<!-- ═══════════ HERO ═══════════ -->
<section class="hero">
  <h1 id="heroTitle">أصل الكشري المصري.. بلمسة ملكية فاخرة</h1>
  <p id="heroSub">تجربة طعام غير مسبوقة في قلب أسوان</p>
</section>

<!-- ═══════════ MENU ═══════════ -->
<div class="container">
  <div class="filter-bar" id="filterBar"></div>
  <div class="menu-grid" id="menuGrid"></div>
</div>

<!-- ═══════════ ORDER MODAL ═══════════ -->
<div class="modal-overlay" id="orderModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalEmoji" style="text-align:center;font-size:3rem;margin-bottom:10px;">🍛</div>
    <div class="modal-dish-name" id="modalName"></div>
    <div class="modal-dish-desc" id="modalDesc"></div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeModalQty(-1)">−</button>
      <div class="qty-display" id="modalQty">1</div>
      <button class="qty-btn" onclick="changeModalQty(1)">+</button>
    </div>
    <div class="modal-total" id="modalTotal"></div>
    <div class="modal-actions">
      <button class="btn-action btn-phone" onclick="orderByPhone()">
        📞 <span id="phoneBtnText">اتصل الآن وأكّد طلبك</span>
      </button>
      <button class="btn-action btn-whatsapp" onclick="orderByWhatsApp()">
        💬 <span id="waBtnText">أرسل الطلب عبر واتساب</span>
      </button>
    </div>
  </div>
</div>

<!-- ═══════════ FLOATING CART BAR ═══════════ -->
<div class="cart-float" id="cartFloat">
  <div class="cart-info-area">
    <div class="cart-badge" id="cartBadge">0</div>
    <div class="cart-total-text">
      <span id="cartTotalDisplay">0</span> <span id="cartCurr">ج.م</span>
    </div>
  </div>
  <button class="btn-view-cart" onclick="openCartDrawer()" id="viewCartBtn">عرض السلة</button>
</div>

<!-- ═══════════ CART DRAWER ═══════════ -->
<div class="cart-drawer-overlay" id="cartOverlay" onclick="closeCartDrawer()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer-handle"></div>
  <h3 id="cartDrawerTitle">🛒 سلة الطلبات</h3>
  <div id="cartList"></div>
  <div class="cart-summary" id="cartSummary"></div>
</div>

<!-- ═══════════ TOAST ═══════════ -->
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════
   DATA & STATE
   ══════════════════════════════════════════ */
const PHONE = '+201095549241';
const WA_NUM = '201095549241';

const defaultMenu = [
  { id:1, nameAr:'طبق الصفوة الملكي', nameEn:'Safwa Royal Bowl',
    descAr:'كشري كامل مع حلو وتقلية مضاعفة وصلصة الصفوة الخاصة',
    descEn:'Full Koshary with dessert, double fried onions & Safwa special sauce',
    price:65, category:'royal', emoji:'👑' },
  { id:2, nameAr:'كشري كينج عائلي', nameEn:'King Family Koshary',
    descAr:'طبق عائلي كبير يكفي ٣-٤ أشخاص بتقلية وصلصة إضافية',
    descEn:'Large family bowl for 3-4 persons with extra toppings',
    price:50, category:'royal', emoji:'🍲' },
  { id:3, nameAr:'طاجن مكرونة باللحم والصلصة', nameEn:'Meat Pasta Casserole',
    descAr:'طاجن فخار بالفرن باللحم المفروم والصلصة الحمرا والبشاميل',
    descEn:'Clay-oven baked casserole with minced meat, red sauce & béchamel',
    price:55, category:'tajin', emoji:'🫕' },
  { id:4, nameAr:'طبق كشري عادي', nameEn:'Classic Koshary Bowl',
    descAr:'كشري مصري أصيل بالعدس والأرز والمكرونة والصلصة',
    descEn:'Authentic Egyptian Koshary with lentils, rice, pasta & sauce',
    price:35, category:'classic', emoji:'🍛' },
  { id:5, nameAr:'أم علي بالمكسرات', nameEn:'Om Ali Dessert',
    descAr:'أم علي بالقشطة والمكسرات على الطريقة الأسوانية',
    descEn:'Traditional Om Ali with cream & nuts, Aswan style',
    price:30, category:'dessert', emoji:'🍮' }
];

const categories = {
  ar: { all:'الكل', royal:'كشري ملكي', tajin:'طواجن', classic:'كلاسيك', dessert:'حلويات' },
  en: { all:'All', royal:'Royal Koshary', tajin:'Casseroles', classic:'Classic', dessert:'Desserts' }
};

const i18n = {
  ar: {
    heroTitle: 'أصل الكشري المصري.. بلمسة ملكية فاخرة',
    heroSub: 'تجربة طعام غير مسبوقة في قلب أسوان',
    kitchenLabel: 'المطبخ مفتوح',
    orderNow: 'اطلب الآن 🔥',
    currency: 'ج.م',
    total: 'الإجمالي:',
    phoneBtnText: 'اتصل الآن وأكّد طلبك',
    waBtnText: 'أرسل الطلب عبر واتساب',
    viewCart: 'عرض السلة',
    cartTitle: '🛒 سلة الطلبات',
    cartEmpty: '🛒 السلة فارغة.. يلا اطلب!',
    clearAll: 'مسح الكل',
    sendAll: 'أرسل الكل واتساب 💬',
    callAll: 'اتصل وأكّد الكل 📞',
    added: '✅ تمت الإضافة',
    cleared: '🗑️ تم مسح السلة'
  },
  en: {
    heroTitle: 'The Authentic Egyptian Koshary.. A Royal Touch',
    heroSub: 'An unparalleled dining experience in the heart of Aswan',
    kitchenLabel: 'Kitchen Open',
    orderNow: 'Order Now 🔥',
    currency: 'EGP',
    total: 'Total:',
    phoneBtnText: 'Call Now & Confirm',
    waBtnText: 'Send via WhatsApp',
    viewCart: 'View Cart',
    cartTitle: '🛒 Your Order',
    cartEmpty: '🛒 Cart is empty.. Start ordering!',
    clearAll: 'Clear All',
    sendAll: 'Send All via WhatsApp 💬',
    callAll: 'Call & Confirm All 📞',
    added: '✅ Added to cart',
    cleared: '🗑️ Cart cleared'
  }
};

let menu = JSON.parse(localStorage.getItem('safwa_menu')) || JSON.parse(JSON.stringify(defaultMenu));
let cart = [];
let lang = localStorage.getItem('safwa_lang') || 'ar';
let theme = localStorage.getItem('safwa_theme') || 'dark';
let activeFilter = 'all';
let modalDish = null;
let modalQty = 1;

/* ══════════════════════════════════════════
   UTILITIES
   ══════════════════════════════════════════ */
function t(key) { return i18n[lang][key] || key; }

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function saveMenu() {
  localStorage.setItem('safwa_menu', JSON.stringify(menu));
}

function pushOrder(order) {
  const orders = JSON.parse(localStorage.getItem('safwa_orders') || '[]');
  orders.unshift(order);
  localStorage.setItem('safwa_orders', JSON.stringify(orders));
  // Signal for kitchen.html
  localStorage.setItem('safwa_order_signal', Date.now().toString());
}

/* ══════════════════════════════════════════
   THEME & LANGUAGE
   ══════════════════════════════════════════ */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeIcon').textContent = theme === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('safwa_theme', theme);
}

function toggleTheme() {
  const icon = document.getElementById('themeIcon');
  icon.style.transform = 'rotate(360deg)';
  setTimeout(() => { icon.style.transform = ''; }, 600);
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
}

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langBtn').textContent = lang === 'ar' ? 'English' : 'عربي';
  document.getElementById('heroTitle').textContent = t('heroTitle');
  document.getElementById('heroSub').textContent = t('heroSub');
  document.getElementById('kitchenLabel').textContent = t('kitchenLabel');
  document.getElementById('viewCartBtn').textContent = t('viewCart');
  document.getElementById('cartDrawerTitle').textContent = t('cartTitle');
  document.getElementById('phoneBtnText').textContent = t('phoneBtnText');
  document.getElementById('waBtnText').textContent = t('waBtnText');
  localStorage.setItem('safwa_lang', lang);

  renderFilters();
  renderMenu();
  renderCart();
}

function toggleLang() {
  lang = lang === 'ar' ? 'en' : 'ar';
  applyLang();
}

/* ══════════════════════════════════════════
   RENDER FUNCTIONS
   ══════════════════════════════════════════ */
function renderFilters() {
  const bar = document.getElementById('filterBar');
  const cats = categories[lang];
  bar.innerHTML = '';
  Object.entries(cats).forEach(([key, label]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (activeFilter === key ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => { activeFilter = key; renderFilters(); renderMenu(); };
    bar.appendChild(btn);
  });
}

function renderMenu() {
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = '';

  const filtered = activeFilter === 'all' ? menu : menu.filter(d => d.category === activeFilter);

  if (filtered.length === 0) {
    grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--text2);font-size:1.1rem;">
      ${lang === 'ar' ? 'لا توجد أصناف في هذا التصنيف' : 'No items in this category'}</p>`;
    return;
  }

  filtered.forEach((dish, i) => {
    const name = lang === 'ar' ? dish.nameAr : dish.nameEn;
    const desc = lang === 'ar' ? dish.descAr : dish.descEn;
    const catLabel = categories[lang][dish.category] || '';
    const card = document.createElement('div');
    card.className = `dish-card stagger-${(i % 6) + 1}`;
    card.innerHTML = `
      <div class="card-img-area">${dish.emoji || '🍛'}</div>
      <div class="card-body">
        <div class="card-category">${catLabel}</div>
        <div class="card-title">${name}</div>
        <div class="card-desc">${desc}</div>
        <div class="card-footer">
          <div class="card-price">${dish.price} <span class="curr">${t('currency')}</span></div>
          <button class="btn-order" onclick="openOrderModal(${dish.id})">${t('orderNow')}</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

/* ══════════════════════════════════════════
   ORDER MODAL
   ══════════════════════════════════════════ */
function openOrderModal(id) {
  modalDish = menu.find(d => d.id === id);
  if (!modalDish) return;
  modalQty = 1;
  updateModalUI();
  document.getElementById('orderModal').classList.add('open');
}

function closeModal() {
  document.getElementById('orderModal').classList.remove('open');
}

function changeModalQty(d) {
  modalQty = Math.max(1, modalQty + d);
  updateModalUI();
}

function updateModalUI() {
  if (!modalDish) return;
  const name = lang === 'ar' ? modalDish.nameAr : modalDish.nameEn;
  const desc = lang === 'ar' ? modalDish.descAr : modalDish.descEn;
  document.getElementById('modalEmoji').textContent = modalDish.emoji || '🍛';
  document.getElementById('modalName').textContent = name;
  document.getElementById('modalDesc').textContent = desc;
  document.getElementById('modalQty').textContent = modalQty;
  document.getElementById('modalTotal').innerHTML =
    `${t('total')} <span>${modalDish.price * modalQty} ${t('currency')}</span>`;
}

function buildOrderObj(type) {
  return {
    id: Date.now(),
    items: [{ id: modalDish.id, nameAr: modalDish.nameAr, nameEn: modalDish.nameEn,
              price: modalDish.price, qty: modalQty, emoji: modalDish.emoji }],
    total: modalDish.price * modalQty,
    type: type,
    timestamp: new Date().toISOString(),
    status: 'pending'
  };
}

function orderByPhone() {
  if (!modalDish) return;
  const order = buildOrderObj('phone');
  pushOrder(order);
  closeModal();
  addToCartSilent(modalDish, modalQty);
  showToast(lang === 'ar' ? '📞 جاري الاتصال... الطلب اتسجّل في المطبخ!' : '📞 Calling... Order registered!');
  setTimeout(() => { window.location.href = `tel:${PHONE}`; }, 600);
}

function orderByWhatsApp() {
  if (!modalDish) return;
  const order = buildOrderObj('whatsapp');
  pushOrder(order);
  closeModal();
  addToCartSilent(modalDish, modalQty);

  const name = lang === 'ar' ? modalDish.nameAr : modalDish.nameEn;
  let msg = lang === 'ar'
    ? `🍛 *طلب جديد من كشري الصفوة*\n\n📋 الطلب:\n• ${name} × ${modalQty}\n💰 الإجمالي: ${modalDish.price * modalQty} ج.م\n\n⏰ ${new Date().toLocaleString('ar-EG')}`
    : `🍛 *New Order - El-Safwa Koshary*\n\n📋 Order:\n• ${name} × ${modalQty}\n💰 Total: ${modalDish.price * modalQty} EGP\n\n⏰ ${new Date().toLocaleString('en-US')}`;

  showToast(lang === 'ar' ? '💬 جاري فتح واتساب...' : '💬 Opening WhatsApp...');
  setTimeout(() => {
    window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
  }, 500);
}

/* ══════════════════════════════════════════
   CART SYSTEM
   ══════════════════════════════════════════ */
function addToCartSilent(dish, qty) {
  const existing = cart.find(c => c.dish.id === dish.id);
  if (existing) { existing.qty += qty; }
  else { cart.push({ dish, qty }); }
  updateCartFloat();
  showToast(t('added'));
}

function updateCartFloat() {
  const count = cart.reduce((s, c) => s + c.qty, 0);
  const total = cart.reduce((s, c) => s + c.dish.price * c.qty, 0);
  document.getElementById('cartBadge').textContent = count;
  document.getElementById('cartTotalDisplay').textContent = total;
  document.getElementById('cartCurr').textContent = t('currency');

  const bar = document.getElementById('cartFloat');
  if (count > 0) bar.classList.add('visible');
  else bar.classList.remove('visible');

  // Re-pop badge
  const badge = document.getElementById('cartBadge');
  badge.style.animation = 'none';
  badge.offsetHeight; // reflow
  badge.style.animation = 'badgePop 0.4s ease';
}

function openCartDrawer() {
  renderCart();
  document.getElementById('cartOverlay').classList.add('open');
  document.getElementById('cartDrawer').classList.add('open');
}

function closeCartDrawer() {
  document.getElementById('cartOverlay').classList.remove('open');
  document.getElementById('cartDrawer').classList.remove('open');
}

function renderCart() {
  const list = document.getElementById('cartList');
  const summary = document.getElementById('cartSummary');

  if (cart.length === 0) {
    list.innerHTML = `<div class="cart-empty-msg">${t('cartEmpty')}</div>`;
    summary.innerHTML = '';
    return;
  }

  list.innerHTML = '';
  cart.forEach(c => {
    const name = lang === 'ar' ? c.dish.nameAr : c.dish.nameEn;
    const row = document.createElement('div');
    row.className = 'cart-row';
    row.innerHTML = `
      <span class="cart-row-name">${c.dish.emoji || ''} ${name}</span>
      <div class="cart-row-qty">
        <button onclick="cartQty(${c.dish.id},-1)">−</button>
        <span>${c.qty}</span>
        <button onclick="cartQty(${c.dish.id},1)">+</button>
      </div>
      <span class="cart-row-price">${c.dish.price * c.qty} ${t('currency')}</span>
      <button class="cart-row-remove" onclick="cartRemove(${c.dish.id})">🗑️</button>`;
    list.appendChild(row);
  });

  const grandTotal = cart.reduce((s, c) => s + c.dish.price * c.qty, 0);
  summary.innerHTML = `
    <div class="cart-grand-total">${t('total')} ${grandTotal} ${t('currency')}</div>
    <div class="cart-send-actions">
      <button class="btn-action btn-whatsapp" onclick="sendCartWA()">${t('sendAll')}</button>
      <button class="btn-action btn-phone" onclick="sendCartPhone()">${t('callAll')}</button>
    </div>
    <button class="ctrl-btn" style="margin-top:12px;width:100%;" onclick="clearAllCart()">${t('clearAll')}</button>`;
}

function cartQty(id, d) {
  const entry = cart.find(c => c.dish.id === id);
  if (!entry) return;
  entry.qty += d;
  if (entry.qty <= 0) cart = cart.filter(c => c.dish.id !== id);
  updateCartFloat();
  renderCart();
}

function cartRemove(id) {
  cart = cart.filter(c => c.dish.id !== id);
  updateCartFloat();
  renderCart();
}

function clearAllCart() {
  cart = [];
  updateCartFloat();
  renderCart();
  showToast(t('cleared'));
}

function buildCartOrderObj(type) {
  return {
    id: Date.now(),
    items: cart.map(c => ({
      id: c.dish.id, nameAr: c.dish.nameAr, nameEn: c.dish.nameEn,
      price: c.dish.price, qty: c.qty, emoji: c.dish.emoji
    })),
    total: cart.reduce((s, c) => s + c.dish.price * c.qty, 0),
    type: type,
    timestamp: new Date().toISOString(),
    status: 'pending'
  };
}

function sendCartWA() {
  if (cart.length === 0) return;
  const order = buildCartOrderObj('whatsapp');
  pushOrder(order);

  let msg = lang === 'ar'
    ? '🍛 *طلب جديد من كشري الصفوة*\n\n📋 الطلب:\n'
    : '🍛 *New Order - El-Safwa Koshary*\n\n📋 Order:\n';

  cart.forEach((c, i) => {
    const name = lang === 'ar' ? c.dish.nameAr : c.dish.nameEn;
    msg += `${i + 1}. ${name} × ${c.qty} — ${c.dish.price * c.qty} ${lang === 'ar' ? 'ج.م' : 'EGP'}\n`;
  });

  msg += lang === 'ar'
    ? `\n💰 *الإجمالي: ${order.total} ج.م*\n⏰ ${new Date().toLocaleString('ar-EG')}`
    : `\n💰 *Total: ${order.total} EGP*\n⏰ ${new Date().toLocaleString('en-US')}`;

  closeCartDrawer();
  showToast(lang === 'ar' ? '💬 جاري فتح واتساب...' : '💬 Opening WhatsApp...');
  setTimeout(() => {
    window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
  }, 500);
}

function sendCartPhone() {
  if (cart.length === 0) return;
  const order = buildCartOrderObj('phone');
  pushOrder(order);
  closeCartDrawer();
  showToast(lang === 'ar' ? '📞 جاري الاتصال...' : '📞 Calling...');
  setTimeout(() => { window.location.href = `tel:${PHONE}`; }, 600);
}

/* ══════════════════════════════════════════
   LIVE SYNC (listen for menu changes from kitchen)
   ══════════════════════════════════════════ */
window.addEventListener('storage', (e) => {
  if (e.key === 'safwa_menu') {
    menu = JSON.parse(e.newValue || '[]');
    renderMenu();
  }
});

/* ══════════════════════════════════════════
   MODAL BACKDROP CLOSE
   ══════════════════════════════════════════ */
document.getElementById('orderModal').addEventListener('click', (e) => {
  if (e.target.classList.contains('modal-overlay')) closeModal();
});

/* ══════════════════════════════════════════
   INITIALIZE
   ══════════════════════════════════════════ */
(function init() {
  applyTheme();
  applyLang();
  updateCartFloat();
})();
</script>
</body>
</html>
